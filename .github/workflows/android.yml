# LetraMestre — Pipeline de Build Android
#
# Dispara em push de tag v*. Faz build do APK debug e publica como artifact.
# Em PR para main, roda apenas validação de config (sem compilar APK).
#
# Pré-requisitos no repo:
#   - app/ com gradlew, build.gradle.kts, settings.gradle.kts.
#   - Android SDK API 34+.
#   - JDK 17.

name: Android Build

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0

      - name: Validar gradle wrapper
        run: |
          test -f ./gradlew || { echo "❌ gradlew ausente"; exit 1; }
          test -x ./gradlew || chmod +x ./gradlew
          test -f gradle/wrapper/gradle-wrapper.jar || { echo "❌ gradle-wrapper.jar ausente"; exit 1; }
          test -f gradle/wrapper/gradle-wrapper.properties || { echo "❌ gradle-wrapper.properties ausente"; exit 1; }
          echo "✓ Gradle wrapper presente e válido"

      - name: Validar build.gradle.kts (sintaxe)
        run: |
          test -f build.gradle.kts || { echo "❌ build.gradle.kts ausente"; exit 1; }
          test -f settings.gradle.kts || { echo "❌ settings.gradle.kts ausente"; exit 1; }
          echo "✓ Arquivos de build presentes"

      # Em PR: apenas valida config (não compila APK, mais rápido).
      - name: Validação de config (PR-only)
        if: github.event_name == 'pull_request'
        run: |
          echo "### Validação de config Android (PR)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✓ Gradle wrapper OK" >> $GITHUB_STEP_SUMMARY
          echo "✓ build.gradle.kts presente" >> $GITHUB_STEP_SUMMARY
          echo "✓ settings.gradle.kts presente" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Compilação completa do APK roda apenas em push de tag v*." >> $GITHUB_STEP_SUMMARY

      # Em push de tag: compila o APK completo.
      - name: Assemble debug APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Validar APK gerado
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          # O working-directory é app/, então o path relativo é:
          APK_REL="build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_REL" || { echo "❌ APK não encontrado em $APK_REL"; exit 1; }
          SIZE=$(stat -c%s "$APK_REL")
          echo "✓ APK gerado: $APK_REL ($(numfmt --to=iec $SIZE))"

      - name: Upload do APK (artifact)
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: actions/upload-artifact@v4
        with:
          name: letramestre-android-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
          if-no-files-found: error

      - name: Resumo
        if: always()
        run: |
          echo "### Android Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Ref: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Event: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "- APK: \`app/build/outputs/apk/debug/app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Modo: validação de config (sem compilar APK)" >> $GITHUB_STEP_SUMMARY
          fi
