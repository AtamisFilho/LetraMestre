name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            web/.next/cache
          key: ${{ runner.os }}-bun-web-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-web-
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        env:
          DATABASE_URL: file:./ci.db
        run: bun run db:generate
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test:run
      - name: Build (standalone)
        env:
          DATABASE_URL: file:./ci.db
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun run build:ci

  game-server:
    name: Game-server (tsc --noEmit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/mini-services/game-server
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-game-server-${{ hashFiles('web/mini-services/game-server/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-game-server-
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit --esModuleInterop --skipLibCheck --moduleResolution bundler --target ES2022 --module ESNext --resolveJsonModule index.ts
