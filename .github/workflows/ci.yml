# LetraMestre — Pipeline de CI (web app)
#
# Dispara em push/PR para main. Roda lint, typecheck, testes (vitest) e build.
# Em push de tag v*, dispara também o workflow de Android (android.yml).
#
# Pré-requisitos no repo:
#   - package.json com scripts: lint, typecheck (opcional), test:run, build.
#   - Vitest configurado (suite de 218 testes).
#   - Banco de testes SQLite isolado (ex.: DATABASE_URL="file:./db/test.db").

name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

# Cancela runs anteriores da mesma branch quando um novo push chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Banco de testes isolado — NÃO usa o banco de dev/prod.
      DATABASE_URL: "file:./db/test.db"
      AUTH_SECRET: "ci-test-secret-32-chars-minimum-ok"
      INTERNAL_API_KEY: "ci-test-internal-key-32-chars-ok"
      ADMIN_USERNAME: "ci-admin"
      ADMIN_PASSWORD: "ci-test-password-12chars"
      WEB_ORIGIN: "http://localhost:3000"
      GAME_SERVER_PORT: "3003"
      WEB_API_URL: "http://localhost:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Gerar cliente Prisma
        run: bun run db:generate

      - name: Aplicar schema (banco de testes)
        run: bun run db:push

      - name: Lint
        run: bun run lint

      - name: Typecheck (se disponível)
        run: |
          if bun run --help 2>/dev/null | grep -q "typecheck"; then
            bun run typecheck
          else
            echo "Script 'typecheck' não definido no package.json — pulando."
          fi

      - name: Testes (vitest)
        run: |
          if bun run --help 2>/dev/null | grep -q "test:run"; then
            bun run test:run
          else
            echo "Script 'test:run' não definido — pulando."
          fi

      - name: Build
        run: bun run build

      - name: Validar secrets (smoke test)
        run: |
          # Em CI usamos defaults de teste — o validador deve sair 0.
          # Este passo garante que o script continua funcional.
          bun run scripts/validate-secrets.ts --json | tee /tmp/secrets.json
          # Não falha o CI se houver warning; critical sim.
          # (Em CI de produção, troque para falhar em warning.)

      - name: Backup de smoke test
        run: |
          # Garante que o script de backup funciona.
          bun run scripts/backup-db.ts --keep 5

      - name: Upload de artefatos (build standalone)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: letramestre-standalone-${{ github.ref_name }}
          path: |
            .next/standalone
            .next/static
            public
          retention-days: 30

      - name: Resumo do CI
        if: always()
        run: |
          echo "### CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Branch/Tag: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Run: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
